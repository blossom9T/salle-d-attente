<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salle d’attente — mini-jeux à plusieurs</title>
    <meta name="description" content="Six petits jeux rapides à lancer pendant un vocal, de 1 à 10 joueurs : Bombe, Mot mystère, Morpion, Réflexe, Calcul éclair et Course de frappe." />
    <meta name="theme-color" content="#E4E9E6" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/dm-sans.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="assets/fonts/archivo-black.woff" as="font" type="font/woff" crossorigin />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      // Thème choisi avant l'affichage, pour éviter un flash.
      (function () {
        var t = localStorage.getItem("sa.theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "nuit" : "jour";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body>
    <a class="evitement" href="#app">Aller au contenu</a>
    <header id="entete" class="entete"></header>
    <main id="app" class="page" tabindex="-1">
      <noscript>Ce site a besoin de JavaScript pour fonctionner.</noscript>
    </main>
    <footer class="pied">
      <p>Salle d’attente. Des jeux pour patienter, pas pour rester.</p>
    </footer>
    <div id="notifications" class="notifications"></div>
  </body>
</html>
