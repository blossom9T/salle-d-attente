:root,
[data-theme="jour"] {
  --mur: #e4e9e6;
  --papier: #fafbfa;
  --papier-2: #eef2f0;
  --encre: #17202a;
  --gris: #56656c;
  --trait: #c9d2ce;
  --trait-fort: #94a39e;
  --ecran: #d3ded8;
  --seg-on: #1e2b33;
  --seg-off: rgba(30, 43, 51, 0.07);
  --rouge: #d9463a;
  --teinte-force: 60%;
  --bleu: #2348c8;
  --vert: #1f9a5a;
  --jaune: #cf9a00;
  --gris-case: #7d8a92;
  --ok: #12804f;
  --alerte: #b93d0c;
  --ombre: 0 1px 0 rgba(23, 32, 42, 0.05), 0 14px 30px -18px rgba(23, 32, 42, 0.45);
  --texte: "DM Sans", system-ui, sans-serif;
  --titre: "Archivo Black", "DM Sans", system-ui, sans-serif;
  color-scheme: light;
}
[data-theme="nuit"] {
  --mur: #10161a;
  --papier: #182026;
  --papier-2: #1f2930;
  --encre: #e6ecee;
  --gris: #94a3aa;
  --trait: #2b363d;
  --trait-fort: #4a5961;
  --ecran: #25313a;
  --seg-on: #dde7ea;
  --seg-off: rgba(221, 231, 234, 0.06);
  --rouge: #e5604f;
  --teinte-force: 26%;
  --bleu: #86a2ff;
  --vert: #22a462;
  --jaune: #c99600;
  --gris-case: #56636b;
  --ok: #3fbf80;
  --alerte: #f07a43;
  --ombre: 0 14px 30px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

/* ── Base ─────────────────────────────────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--mur);
  color: var(--encre);
  font: 400 16px/1.55 var(--texte);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}
h1,
h2,
h3 {
  margin: 0;
  font-weight: 400;
  font-family: var(--titre);
  line-height: 1.1;
  letter-spacing: -0.01em;
}
p {
  margin: 0;
}
a {
  color: inherit;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 3px solid var(--bleu);
  outline-offset: 2px;
}
.visuellement-cache {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.evitement {
  position: absolute;
  left: 12px;
  top: -60px;
  padding: 8px 12px;
  background: var(--encre);
  color: var(--papier);
  border-radius: 6px;
  z-index: 10;
}
.evitement:focus {
  top: 12px;
}
.discret {
  color: var(--gris);
  font-size: 14px;
}
.page {
  flex: 1;
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  padding: 32px 24px 64px;
  outline: none;
}

/* ── En-tête ──────────────────────────────────────────────── */
.entete {
  border-bottom: 1px solid var(--trait);
}
.entete-int {
  max-width: 1160px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 28px;
}
.logo {
  font-family: var(--titre);
  font-size: 20px;
  text-decoration: none;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.nav {
  display: flex;
  gap: 4px;
}
.nav a {
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 500;
  color: var(--gris);
}
.nav a:hover {
  color: var(--encre);
}
.nav a.actif {
  color: var(--encre);
  box-shadow: inset 0 -2px 0 var(--encre);
  border-radius: 0;
}
.entete-outils {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}
.icone {
  width: 20px;
  height: 20px;
  flex: none;
}
.icone-bouton {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--gris);
  cursor: pointer;
  font-size: 22px;
  line-height: 1;
}
.icone-bouton:hover {
  background: var(--papier-2);
  color: var(--encre);
}
.profil-bouton {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 6px;
  margin-left: 6px;
  border: 1.5px solid var(--trait);
  border-radius: 999px;
  background: var(--papier);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  max-width: 200px;
}
.profil-bouton span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profil-bouton:hover {
  border-color: var(--trait-fort);
}

.pied {
  padding: 24px;
  text-align: center;
  color: var(--gris);
  font-size: 13px;
}

/* ── Éléments communs ─────────────────────────────────────── */
.bouton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border: 1.5px solid var(--encre);
  border-radius: 8px;
  background: transparent;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.12s, color 0.12s, transform 0.08s;
}
.bouton:hover {
  background: var(--papier-2);
}
.bouton:active {
  transform: translateY(1px);
}
.bouton-plein {
  background: var(--encre);
  color: var(--papier);
}
.bouton-plein:hover {
  background: color-mix(in srgb, var(--encre) 86%, var(--mur));
}
.bouton-discret {
  border-color: var(--trait);
}
.bouton-discret:hover {
  border-color: var(--trait-fort);
}
.bouton-grand {
  padding: 14px 24px;
  font-size: 17px;
}
.bouton:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.lien {
  border: 0;
  background: none;
  padding: 0;
  color: var(--bleu);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.champ {
  width: 100%;
  min-width: 0;
  padding: 10px 12px;
  border: 1.5px solid var(--trait-fort);
  border-radius: 8px;
  background: var(--papier);
  font-size: 16px;
}
.champ:focus {
  border-color: var(--encre);
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bleu) 35%, transparent);
}
.champ:disabled {
  background: var(--papier-2);
  color: var(--gris);
}
.etiquette-champ {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 6px;
}
.ligne-champ {
  display: flex;
  gap: 8px;
}
.erreur-texte {
  color: var(--alerte);
  font-size: 14px;
  min-height: 0;
}
.erreur-texte:not(:empty) {
  margin-top: 6px;
}
.titre-page {
  font-size: clamp(28px, 4vw, 39px);
}
.titre-section {
  font-size: 25px;
  margin-bottom: 8px;
}
.chapeau {
  font-size: 18px;
  color: var(--gris);
  max-width: 58ch;
}
.avis {
  padding: 12px 16px;
  border-left: 4px solid var(--bleu);
  background: var(--papier);
  border-radius: 0 8px 8px 0;
  font-size: 15px;
  max-width: 70ch;
}
.attente,
.attente-connexion {
  color: var(--gris);
}
.attente-connexion {
  padding: 48px 0;
}

/* Afficheur 7 segments */
.ecran {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--ecran);
  border-radius: 6px;
  padding: 10px 14px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.14);
}
.seg {
  display: block;
  width: auto;
  overflow: visible;
}
.seg .on {
  fill: var(--seg-on);
}
.seg .off {
  fill: var(--seg-off);
}
.seg-s {
  height: 20px;
}
.seg-m {
  height: 34px;
}
.seg-l {
  height: 62px;
}

/* Avatars */
.avatar {
  --taille: 36px;
  width: var(--taille);
  height: var(--taille);
  flex: none;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: var(--c);
  color: #fff;
  font-weight: 700;
  font-size: calc(var(--taille) * 0.42);
  line-height: 1;
  user-select: none;
}
.avatar-s {
  --taille: 24px;
}
.avatar-l {
  --taille: 56px;
}
.etiquette {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  min-width: 0;
}
.etiquette-nom {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Choix segmentés */
.segmente {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 3px;
  border: 1.5px solid var(--trait);
  border-radius: 9px;
  background: var(--papier);
}
.segmente-choix {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  color: var(--gris);
}
.segmente-choix:hover:not(:disabled) {
  color: var(--encre);
}
.segmente-choix[aria-checked="true"] {
  background: var(--encre);
  color: var(--papier);
}
.segmente-choix:disabled {
  cursor: default;
}
.segmente-choix:disabled[aria-checked="false"] {
  opacity: 0.55;
}

/* Notifications */
.notifications {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  z-index: 50;
  width: max-content;
  max-width: calc(100% - 32px);
}
.notif {
  background: var(--encre);
  color: var(--papier);
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: 500;
  box-shadow: var(--ombre);
  animation: monte 0.2s ease-out;
}
.notif-alerte {
  background: var(--alerte);
  color: #fff;
}
.notif.sortie {
  opacity: 0;
  transition: opacity 0.3s;
}

/* Dialogue profil */
.dialogue {
  border: 0;
  border-radius: 14px;
  padding: 24px;
  width: min(440px, calc(100% - 32px));
  background: var(--papier);
  color: var(--encre);
  box-shadow: var(--ombre);
}
.dialogue::backdrop {
  background: rgba(9, 12, 15, 0.55);
}
.dialogue-tete {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.dialogue-tete h2 {
  font-size: 25px;
}
.dialogue .discret {
  margin-bottom: 18px;
}
.form-profil .etiquette-champ + .nuancier,
.form-profil p.etiquette-champ {
  margin-top: 18px;
}
.form-profil.compact p.etiquette-champ {
  margin-top: 14px;
}
.nuancier {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.nuance {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 3px solid var(--papier);
  background: var(--c);
  box-shadow: 0 0 0 1.5px var(--trait);
  cursor: pointer;
  padding: 0;
}
.nuance[aria-checked="true"] {
  box-shadow: 0 0 0 2.5px var(--encre);
}

/* ── Accueil ──────────────────────────────────────────────── */
.accueil-haut {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
  gap: 56px;
  align-items: center;
  padding: 24px 0 56px;
}
.titre-principal {
  font-size: clamp(44px, 6.6vw, 80px);
  line-height: 0.96;
  letter-spacing: -0.035em;
  max-width: 11ch;
  margin-bottom: 24px;
}
.zone-pseudo {
  margin-top: 32px;
  max-width: 460px;
}
.joue-en-tant-que {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  color: var(--gris);
}
.joue-en-tant-que .etiquette {
  color: var(--encre);
}

.distributeur {
  display: grid;
  gap: 28px;
}
.ticket {
  --entaille: radial-gradient(circle 13px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 13px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  position: relative;
  background: var(--papier);
  padding: 26px 30px 22px;
  border-radius: 6px;
  transform: rotate(-1.6deg);
  -webkit-mask: var(--entaille);
  mask: var(--entaille);
  filter: drop-shadow(0 12px 18px rgba(23, 32, 42, 0.18));
  display: grid;
  justify-items: start;
  gap: 14px;
}
.ticket.imprime {
  animation: imprime 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.ticket-titre {
  font-weight: 600;
  font-size: 14px;
  color: var(--gris);
}
.ticket-ecran {
  width: 100%;
  padding: 16px;
}
.ticket .bouton-plein {
  width: 100%;
}
.ticket-note {
  width: 100%;
  padding-top: 12px;
  border-top: 2px dashed var(--trait);
  font-size: 13px;
  color: var(--gris);
}
.rejoindre {
  padding: 0 6px;
}
.champ-code {
  font-family: var(--titre);
  font-size: 22px;
  letter-spacing: 0.3em;
  text-align: center;
  max-width: 200px;
}
.rejoindre .discret {
  margin-top: 8px;
}

.section-programme {
  padding-top: 8px;
}
.programme {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
}
.programme-jeu {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) 150px auto;
  gap: 20px;
  align-items: center;
  padding: 20px 0;
  border-top: 1px solid var(--trait);
}
.programme-jeu:last-child {
  border-bottom: 1px solid var(--trait);
}
.programme-icone {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: color-mix(in srgb, var(--teinte, var(--papier)) var(--teinte-force), var(--papier));
  color: var(--encre);
}
.programme-jeu:hover .programme-icone {
  transform: rotate(-4deg);
}
.programme-icone {
  transition: transform 0.15s;
}
.programme-icone .icone {
  width: 26px;
  height: 26px;
}
.programme-texte h3 {
  font-size: 22px;
  margin-bottom: 3px;
}
.programme-texte p {
  color: var(--gris);
}
.programme-meta {
  display: grid;
  font-size: 14px;
  color: var(--gris);
}
.dernieres {
  margin-top: 48px;
}
.dernieres-liste {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  display: grid;
  gap: 2px;
}
.dernieres-liste li {
  display: grid;
  grid-template-columns: 150px 180px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--trait);
}
.dernieres-jeu {
  font-weight: 600;
}

/* ── Salon ────────────────────────────────────────────────── */
.entree-salon {
  max-width: 520px;
  margin: 32px auto;
  display: grid;
  gap: 16px;
  justify-items: start;
}
.entree-salon .form-profil {
  width: 100%;
  margin-top: 8px;
}
.salon {
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  gap: 40px;
  align-items: start;
}
.salon-cote {
  position: sticky;
  top: 20px;
  display: grid;
  gap: 16px;
}
.salon-ticket {
  --entaille: radial-gradient(circle 10px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 10px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  -webkit-mask: var(--entaille);
  mask: var(--entaille);
  background: var(--papier);
  padding: 18px 22px;
  border-radius: 6px;
  display: grid;
  gap: 10px;
  justify-items: start;
}
.salon-ticket .ecran {
  width: 100%;
}
.copier {
  width: 100%;
  font-size: 14px;
}
.titre-cote {
  font-size: 18px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 6px;
}
.titre-cote .compte {
  font-family: var(--texte);
  font-weight: 600;
  font-size: 14px;
  color: var(--gris);
  font-variant-numeric: tabular-nums;
}
.joueurs {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 2px;
}
.joueurs li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--trait);
}
.joueur-nom {
  font-weight: 600;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge-hote {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--gris);
}
.badge-hote .icone {
  width: 15px;
  height: 15px;
  color: var(--jaune);
}
.astuce,
.mode {
  font-size: 13px;
}
.mode {
  color: var(--gris);
}
.quitter {
  justify-self: start;
  font-size: 14px;
}
.salon-scene {
  min-width: 0;
  display: grid;
  gap: 24px;
  align-content: start;
}

.choix-jeux {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.choix-jeu {
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 12px;
  align-items: center;
  text-align: left;
  padding: 12px 14px;
  border: 1.5px solid var(--trait);
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
}
.choix-jeu .icone {
  grid-row: span 2;
  width: 26px;
  height: 26px;
}
.choix-nom {
  font-weight: 700;
}
.choix-duree {
  font-size: 13px;
  color: var(--gris);
}
.choix-jeu:hover {
  border-color: var(--trait-fort);
}
.choix-jeu[aria-checked="true"] {
  border-color: var(--encre);
  background: var(--papier);
  box-shadow: inset 0 0 0 1px var(--encre);
}

.fiche-jeu {
  background: var(--papier);
  border-radius: 14px;
  padding: 28px;
  display: grid;
  gap: 22px;
}
.fiche-tete {
  display: flex;
  gap: 16px;
  align-items: center;
}
.fiche-tete h2 {
  font-size: 28px;
}
.fiche-tete p {
  color: var(--gris);
}
.regles {
  margin: 0;
  padding-left: 20px;
  display: grid;
  gap: 6px;
  max-width: 72ch;
}
.regles li::marker {
  color: var(--trait-fort);
}
.options {
  display: grid;
  gap: 12px;
}
.option {
  display: grid;
  grid-template-columns: 180px auto;
  align-items: center;
  gap: 12px;
  justify-content: start;
}
.option-nom {
  font-weight: 600;
  font-size: 15px;
}
.lancer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  padding-top: 6px;
}
.preparation {
  display: grid;
  gap: 14px;
  justify-items: start;
}

.jeu-tete {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.jeu-titre {
  font-size: 25px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.jeu-titre .icone {
  width: 26px;
  height: 26px;
}
.zone-jeu {
  min-width: 0;
}

/* Résultats */
.resultats-jeu {
  font-weight: 600;
  color: var(--gris);
  margin-bottom: -16px;
}
.resultats {
  list-style: none;
  padding: 0;
  margin: 0;
  max-width: 640px;
}
.resultats li {
  display: grid;
  grid-template-columns: 58px 36px minmax(0, 1fr) auto 44px;
  align-items: center;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--trait);
  animation: monte 0.3s ease-out backwards;
}
.resultats li:nth-child(2) { animation-delay: 0.05s; }
.resultats li:nth-child(3) { animation-delay: 0.1s; }
.resultats li:nth-child(n + 4) { animation-delay: 0.15s; }
.resultats li:not(:has(.resultat-points)) {
  grid-template-columns: 58px 36px minmax(0, 1fr) auto;
}
.rang {
  padding: 7px 10px;
}
.resultat-nom {
  font-weight: 700;
  display: grid;
  min-width: 0;
}
.resultat-nom .discret {
  font-weight: 400;
}
.resultats .premier .resultat-nom {
  font-size: 19px;
}
.resultat-score {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.resultat-points {
  font-weight: 700;
  color: var(--ok);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.resultats .moi,
.tableau .moi td {
  background: color-mix(in srgb, var(--bleu) 7%, transparent);
}

/* ── Classement ───────────────────────────────────────────── */
.classement {
  display: grid;
  gap: 20px;
}
.onglets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.onglet {
  padding: 7px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--trait);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}
.onglet:hover {
  border-color: var(--trait-fort);
}
.onglet[aria-selected="true"] {
  background: var(--encre);
  border-color: var(--encre);
  color: var(--papier);
}
.tableau {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.tableau th {
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  color: var(--gris);
  padding: 8px 12px;
  border-bottom: 1.5px solid var(--encre);
}
.tableau td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--trait);
}
.tableau .num {
  text-align: right;
}
.tableau .fort {
  font-weight: 700;
}
.tableau-classement {
  max-width: 880px;
}
.rang-cellule {
  width: 72px;
}
.tableau-classement .rang .seg-s {
  height: 16px;
}
.vide {
  padding: 40px 0;
  display: grid;
  gap: 16px;
  justify-items: start;
  color: var(--gris);
}

/* ── Jeu : Bombe ──────────────────────────────────────────── */
.jeu-bombe {
  display: grid;
  justify-items: center;
  gap: 14px;
}
.bombe-table {
  position: relative;
  width: min(100%, 640px);
  aspect-ratio: 1.45;
}
.bombe-objet {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 148px;
  height: 148px;
  transform: translate(-50%, -50%);
}
.bombe-corps {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #45525c, #1b2228 55%, #0d1115);
  display: grid;
  place-items: center;
  box-shadow: 0 16px 30px -14px rgba(0, 0, 0, 0.7);
  z-index: 1;
}
.bombe-syllabe {
  font-family: var(--titre);
  font-size: 42px;
  color: #fff;
  letter-spacing: 0.03em;
}
.bombe-meche {
  position: absolute;
  right: 6px;
  top: -14px;
  width: 44px;
  height: 40px;
  border-top: 4px solid #8a7458;
  border-right: 4px solid transparent;
  border-radius: 50% 60% 0 0;
  transform: rotate(28deg);
}
.bombe-meche::after {
  content: "";
  position: absolute;
  right: -6px;
  top: -9px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff6c7, #ffb020 45%, #f0352a 75%, transparent 78%);
  opacity: 0;
}
.tictac .bombe-meche::after {
  opacity: 1;
  animation: etincelle 0.22s infinite alternate;
}
.tictac .bombe-corps {
  animation: battement 1s ease-in-out infinite;
}
.a-moi .bombe-corps {
  animation-duration: 0.55s;
}
.bombe-fleche {
  position: absolute;
  inset: -34px;
  transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1);
  pointer-events: none;
}
.bombe-fleche::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  border: 11px solid transparent;
  border-bottom: 16px solid var(--encre);
  border-top: 0;
}
.bombe-place {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 128px;
  display: grid;
  justify-items: center;
  gap: 3px;
  text-align: center;
  transition: opacity 0.3s;
}
.bombe-place .avatar {
  transition: box-shadow 0.2s;
}
.bombe-place.actif .avatar {
  box-shadow: 0 0 0 3px var(--mur), 0 0 0 6px var(--c);
}
.bombe-nom {
  font-weight: 600;
  font-size: 14px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bombe-place.actif .bombe-nom {
  font-weight: 800;
}
.bombe-place.elimine {
  opacity: 0.35;
}
.bombe-place.touche {
  animation: secousse 0.5s;
}
.bombe-place.bonus .avatar {
  animation: bonus 0.6s 2;
}
.bombe-vies {
  display: flex;
  gap: 4px;
}
.bombe-vies i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--rouge);
}
.bombe-vies i.pleine {
  background: var(--rouge);
}
.bombe-texte {
  min-height: 1.4em;
  max-width: 160px;
  font-family: var(--titre);
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bombe-place:not(.actif) .bombe-texte {
  color: var(--gris);
  font-size: 13px;
}
.explose .bombe-corps {
  animation: boum 0.6s ease-out;
}
.bombe-formulaire {
  width: min(100%, 460px);
  display: grid;
  gap: 6px;
  justify-items: center;
}
.bombe-champ {
  font-family: var(--titre);
  font-size: 24px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 12px;
}
.bombe-champ::placeholder {
  font-family: var(--texte);
  text-transform: none;
  letter-spacing: 0;
  font-size: 17px;
}
.bombe-aide {
  font-size: 14px;
  color: var(--gris);
  min-height: 1.5em;
}
.bombe-aide.erreur {
  color: var(--alerte);
  font-weight: 600;
}
.refus {
  animation: secousse 0.35s;
}
.bombe-alphabet {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
}
.bombe-alphabet span {
  width: 24px;
  height: 28px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--trait);
  border-radius: 4px;
  color: var(--gris);
}
.bombe-alphabet .utilisee {
  background: var(--encre);
  border-color: var(--encre);
  color: var(--papier);
}
.bombe-dico {
  font-size: 13px;
  color: var(--alerte);
}

/* ── Jeu : Mot mystère ────────────────────────────────────── */
.mot-tete {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.mot-manche {
  font-weight: 600;
  color: var(--gris);
}
.mot-chrono,
.calcul-chrono,
.frappe-chrono {
  padding: 8px 12px;
}
.urgent .seg .on {
  fill: var(--alerte);
  animation: clignote 1s steps(2) infinite;
}
.mot-corps {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
  gap: 36px;
  align-items: start;
}
.mot-principal {
  display: grid;
  justify-items: center;
  gap: 16px;
}
.mot-grille {
  display: grid;
  gap: 6px;
}
.ligne {
  display: grid;
  grid-template-columns: repeat(5, 58px);
  gap: 6px;
}
.case {
  height: 58px;
  display: grid;
  place-items: center;
  border: 2px solid var(--trait);
  border-radius: 6px;
  background: var(--papier);
  font-family: var(--titre);
  font-size: 27px;
  text-transform: uppercase;
}
.case.pleine {
  border-color: var(--trait-fort);
  animation: pose 0.1s ease-out;
}
.case.indice {
  color: var(--trait-fort);
}
.case.v,
.case.j,
.case.g {
  color: #fff;
  animation: retourne 0.35s ease-out backwards;
}
.case.v { background: var(--vert); border-color: var(--vert); }
.case.j { background: var(--jaune); border-color: var(--jaune); }

.mot-message {

}

}
.touche {

}

.touche.j { background: var(--jaune); color: #fff; box-shadow: none; }
.touche.g { background: var(--gris-case); color: #fff; box-shadow: none; opacity: 0.7; }

  cursor: default;
}
.mot-autres {
  display: grid;
  gap: 14px;
}
.mot-autre {
  display: grid;
  gap: 8px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--trait);
}
.mot-autre.parti {
  opacity: 0.4;
}
.mot-autre-tete {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mot-autre-tete .nom {

  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

}
.mini-grille {

/* ── Jeu : Morpion ────────────────────────────────────────── */
.jeu-morpion {

  transition: border-color 0.2s, background-color 0.2s;
}

  fill: none;
  stroke-linecap: round;
}
.morpion-contre {
  color: var(--gris);

}
.morpion-centre {
  grid-area: centre;
  display: grid;
  justify-items: center;
  gap: 14px;
}
.morpion-plateau {
  width: min(100%, 372px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);

}
.morpion-case {
  border: 1.5px solid var(--trait);
  border-radius: 12px;
  background: var(--papier);

  place-items: center;
  padding: 0;
  cursor: pointer;
  transition: background-color 0.15s, opacity 0.2s;
}
.morpion-case:disabled {
  cursor: default;
}
.morpion-case:not(:disabled):hover {
  background: var(--papier-2);
  border-color: var(--trait-fort);
}
.morpion-case svg {
  width: 68%;
  height: 68%;
  stroke: var(--c);
  stroke-width: 11;
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 180;

}
.morpion-case.va-partir svg {
  opacity: 0.3;
}
.morpion-case.gagnante {
  background: color-mix(in srgb, var(--c) 18%, var(--papier));

}
.morpion-minuteur {

  height: 4px;
  border-radius: 2px;
  background: var(--trait);

}

  height: 100%;
  background: var(--encre);

  transition: transform 0.25s linear;
}
.morpion-minuteur.urgent i {
  background: var(--rouge);
}
.morpion-tour {
  font-weight: 600;
  min-height: 1.6em;
}
.morpion-scores {
  grid-area: scores;
  display: grid;
  gap: 12px;
  align-content: start;
}
.morpion-scores h3 {
  font-size: 16px;
}
.morpion-scores ol {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 8px;
}
.morpion-scores li {
  display: flex;
  align-items: center;
  gap: 8px;
}
.morpion-scores .nom {
  flex: 1;
  font-weight: 600;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.compte {
  display: flex;
  gap: 4px;
}
.compte i {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1.5px solid var(--trait-fort);
}
.compte i.gagne {
  background: var(--encre);
  border-color: var(--encre);
}
.morpion-file {
  font-size: 14px;
  color: var(--gris);
}

/* ── Jeu : Réflexe ────────────────────────────────────────── */
.jeu-reflexe {
  display: grid;
  gap: 24px;
}
.reflexe-zone {
  width: 100%;
  min-height: 340px;
  border: 0;
  border-radius: 16px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: #fff;
  background: var(--ecran);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.reflexe-texte {
  display: grid;
  justify-items: center;
  gap: 8px;
  pointer-events: none;
}
.reflexe-texte strong {
  font-family: var(--titre);
  font-weight: 400;
  font-size: clamp(30px, 5vw, 52px);
}
.reflexe-texte span {
  opacity: 0.8;
}
.reflexe-zone[data-etat="pret"] {
  background: var(--papier);
  color: var(--encre);
  box-shadow: inset 0 0 0 1.5px var(--trait);
}
.reflexe-zone[data-etat="attente"] { background: #b42a20; }
.reflexe-zone[data-etat="leurre"] { background: #e07800; }
.reflexe-zone[data-etat="vert"] { background: #179457; }
.reflexe-zone[data-etat="tot"] { background: #4a1612; }
.reflexe-zone[data-etat="fait"] .reflexe-texte span,
.reflexe-zone[data-etat="bilan"] .reflexe-texte span {
  color: #b9c3c8;
}
.tableau td.tot {
  color: var(--alerte);
}

/* ── Jeu : Calcul éclair & course ─────────────────────────── */
.jeu-calcul,
.jeu-frappe {
  display: grid;
  gap: 22px;
}
.calcul-tete,
.frappe-tete {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.calcul-tete {
  justify-content: flex-end;
}
.calcul-carte {
  background: var(--papier);
  border-radius: 16px;
  padding: 40px 24px;
  display: grid;
  justify-items: center;
  gap: 18px;
}
.calcul-operation {
  font-family: var(--titre);
  font-size: clamp(40px, 8vw, 76px);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  min-height: 1.15em;
  display: grid;
  place-items: center;
}
.calcul-operation.decompte {
  background: var(--ecran);
  border-radius: 8px;
  padding: 12px 22px;
}
.calcul-champ {
  max-width: 200px;
  font-family: var(--titre);
  font-size: 32px;
  text-align: center;
}
.calcul-compteur {
  color: var(--gris);
  font-variant-numeric: tabular-nums;
}
.course {
  display: grid;
  gap: 4px;
}
.couloir {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr) 56px;
  align-items: center;
  gap: 14px;
  padding: 4px 0;
}
.couloir-nom {
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.couloir.moi .couloir-nom {
  font-weight: 800;
}
.couloir-piste {
  position: relative;
  height: 30px;
  margin-inline: 14px;
  border-bottom: 2px dashed var(--trait);
}
.couloir-piste.arrivee::after {
  content: "";
  position: absolute;
  right: -14px;
  top: 2px;
  bottom: -2px;
  width: 6px;
  background: repeating-linear-gradient(var(--encre) 0 5px, transparent 5px 10px);
  opacity: 0.7;
}
.couloir-pion {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  transition: left 0.35s ease-out;
}
.couloir-valeur {
  font-weight: 700;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ── Jeu : Course de frappe ───────────────────────────────── */
.frappe-stats {
  font-weight: 600;
}
.frappe-cadre {
  position: relative;
}
.frappe-zone {
  position: relative;
  background: var(--papier);
  border-radius: 14px;
  padding: 26px 28px;
  font-family: "Anonymous Pro", ui-monospace, monospace;
  font-size: 23px;
  line-height: 1.65;
  cursor: text;
  box-shadow: inset 0 0 0 1.5px var(--trait);
}
.frappe-zone:focus-within {
  box-shadow: inset 0 0 0 2px var(--encre);
}
.frappe-texte span.ok {
  color: var(--gris);
  opacity: 0.6;
}
.frappe-texte span.faux {
  color: #fff;
  background: var(--rouge);
  border-radius: 2px;
}
.frappe-texte span.curseur {
  box-shadow: inset 0 -3px 0 var(--bleu);
}
.frappe-champ {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  resize: none;
  border: 0;
  cursor: text;
}
.frappe-decompte {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: color-mix(in srgb, var(--mur) 70%, transparent);
  backdrop-filter: blur(2px);
}
.frappe-decompte .seg {
  background: var(--ecran);
  padding: 12px 20px;
  border-radius: 8px;
  height: 90px;
  box-sizing: content-box;
}
.frappe-decompte[hidden] {
  display: none;
}

/* ── Animations ───────────────────────────────────────────── */
@keyframes monte {
  from { opacity: 0; transform: translateY(6px); }
}
@keyframes imprime {
  0% { transform: rotate(-1.6deg) translateY(10px); }
  60% { transform: rotate(-0.4deg) translateY(-6px); }
  100% { transform: rotate(-1.6deg); }
}
@keyframes battement {
  50% { transform: scale(1.035); }
}
@keyframes etincelle {
  to { transform: scale(1.5); opacity: 0.6; }
}
@keyframes boum {
  0% { transform: scale(1); background: radial-gradient(circle, #fff3c4, #ffb020 40%, #f0352a 70%); }
  35% { transform: scale(1.35); background: radial-gradient(circle, #fff3c4, #ffb020 40%, #f0352a 70%); }
  100% { transform: scale(1); }
}
@keyframes secousse {
  20% { transform: translate(calc(-50% - 7px), -50%); }
  40% { transform: translate(calc(-50% + 7px), -50%); }
  60% { transform: translate(calc(-50% - 4px), -50%); }
  80% { transform: translate(calc(-50% + 4px), -50%); }
}
.champ.refus,
.ligne.refus {
  animation: secousse-simple 0.35s;
}
@keyframes secousse-simple {
  20% { transform: translateX(-7px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
@keyframes bonus {
  50% { transform: scale(1.25); }
}
@keyframes pose {
  from { transform: scale(1.08); }
}
@keyframes retourne {
  from { transform: rotateX(90deg); }
}
@keyframes trace {
  from { stroke-dashoffset: 180; }
  to { stroke-dashoffset: 0; }
}
@keyframes clignote {
  50% { opacity: 0.35; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

      h(
        "div.fiche-jeu",
        { style: { "--teinte": def.teinte } },
        h("div.fiche-tete", h("span.programme-icone", { style: { "--teinte": def.teinte } }, icone(def.id === "motmystere" ? "mot" : def.id)), h("div", h("h2", def.nom), h("p", def.accroche))),
        h("ul.regles", def.regles.map((r) => h("li", r))),
        options,
        salon.estHote
          ? h(
              "div.lancer",
              h("button.bouton.bouton-plein.bouton-grand", { type: "button", disabled: manque > 0, onclick: () => salon.lancer() }, nb === 1 ? "Lancer en solo" : `Lancer pour ${nb} joueurs`),
              manque > 0 ? h("span.discret", `Il manque ${manque} joueur${manque > 1 ? "s" : ""}.`) : null
            )
          : h("p.attente", "La partie démarre quand l'hôte la lance.")
      )
    );
  }

  function contexteJeu(partie) {
    const infos = new Map(partie.joueurs.map((j) => [j.cle, j]));
    return {
      moi: salon.moi.cle,
      joueur: (cle) => infos.get(cle) || salon.membres.find((m) => m.cle === cle) || { pseudo: "?", couleur: "#888" },
      envoyer: (a) => salon.agir(a),
      maintenant: () => salon.maintenant(),
    };
  }

  function dessinerJeu(p) {
    const def = JEUX[p.partie.jeu];
    const zone = h("div.zone-jeu");
    vider(
      scene,
      h(
        "div.jeu-tete",
        h("h1.jeu-titre", { style: { "--teinte": def.teinte } }, icone(def.id === "motmystere" ? "mot" : def.id), def.nom),
        salon.estHote ? h("button.lien", { type: "button", onclick: () => confirm("Arrêter la partie pour tout le monde ?") && salon.retourSalon() }, "Arrêter la partie") : null
      ),
      zone
    );
    partieAffichee = p.partie;
    vueJeu = def.vue(zone, contexteJeu(p.partie));
    vueJeu.maj(p.partie.etat);
  }

  function dessinerResultats(p) {
    const r = p.resultats;
    if (resultatsEntendus !== r.partieId) {
      resultatsEntendus = r.partieId;
      const moiLigne = r.lignes.find((l) => l.cle === salon.moi.cle);
      if (moiLigne?.rang === 1 && r.lignes.length > 1) {
        sons.victoire();
        confettis(r.lignes.map((l) => l.couleur));
      } else sons.fin();
    }
    const def = JEUX[r.jeu];
    const solo = r.lignes.length === 1;
    const statut = {
      "en-cours": "Enregistrement au classement…",
      ok: enLigne ? "Partie enregistrée au classement." : "Partie enregistrée dans le classement de ce navigateur.",
      erreur: "Le classement n'a pas pu être mis à jour. Vérifie la configuration Supabase (voir le README).",
    }[r.enregistrement];
    const gagnant = r.lignes[0];
    vider(
      scene,
      h("p.resultats-jeu", def.nom),
      h(
        "h1.titre-page",
        solo ? `Ton score : ${def.score.format(gagnant.score)}` : gagnant.cle === salon.moi.cle ? "Tu as gagné." : `${gagnant.pseudo} gagne la partie.`
      ),
      h(
        "ol.resultats",
        r.lignes.map((l) =>
          h(
            `li${l.cle === salon.moi.cle ? ".moi" : ""}${l.rang === 1 ? ".premier" : ""}`,
            h("span.ecran.rang", afficheur(String(l.rang), { taille: "s", titre: `Rang ${l.rang}` })),
            avatar(l, "m"),
            h("span.resultat-nom", l.pseudo, l.detail ? h("span.discret", l.detail) : null),
            h("span.resultat-score", def.score.format(l.score)),
            solo ? null : h("span.resultat-points", `+${l.points}`)
          )
        )
      ),
      h("p.discret", statut),
      salon.estHote
        ? h(
            "div.lancer",
            h("button.bouton.bouton-plein.bouton-grand", { type: "button", onclick: () => salon.lancer() }, "Rejouer"),
            h("button.bouton", { type: "button", onclick: () => salon.retourSalon() }, "Choisir un autre jeu")
          )
        : h("p.attente", "L'hôte peut relancer une partie ou choisir un autre jeu.")
    );
  }

  // Les comptes à rebours ont besoin d'être redessinés même sans nouveau message.
  const horloge = setInterval(() => {
    if (vueJeu && partieAffichee) vueJeu.maj(salon.public?.partie?.etat || partieAffichee.etat);
  }, 250);

  salon.rejoindre().catch((e) => {
    console.error(e);
    vider(scene, h("div.preparation", h("h1.titre-page", "Connexion impossible"), h("p", e.message || String(e)), h("a.bouton", { href: "#/" }, "Retour à l'accueil")));
  });
  window.__salon = salon; // pratique pour déboguer depuis la console

  return {
    detruire() {
      clearInterval(horloge);
      vueJeu?.detruire();
      salon.quitter();
    },
  };
}

function confettis(couleurs) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const zone = h("div.confettis", { "aria-hidden": "true" });
  for (let i = 0; i < 70; i++) {
    zone.append(
      h("i", {
        style: {
          left: `${Math.random() * 100}%`,
          "--c": couleurs[i % couleurs.length],
          "--x": `${(Math.random() - 0.5) * 240}px`,
          "--a": `${Math.random() * 900 - 450}deg`,
          "--d": `${1.8 + Math.random() * 1.6}s`,
          "--r": `${Math.random() * 0.5}s`,
        },
      })
    );
  }
  document.body.append(zone);
  setTimeout(() => zone.remove(), 4500);
}

// ── Classement ───────────────────────────────────────────────
function ecranClassement(jeu) {
  const contenu = h("div.classement-contenu", h("p.attente-connexion", "Chargement…"));
  const onglets = h(
    "div.onglets",
    { role: "tablist", "aria-label": "Classement" },
    [{ id: null, nom: "Général" }, ...LISTE_JEUX].map((j) =>
      h("a.onglet", { role: "tab", href: j.id ? `#/classement/${j.id}` : "#/classement", "aria-selected": String(j.id === jeu) }, j.nom)
    )
  );
  vider(
    app,
    h(
      "div.classement",
      h("h1.titre-page", "Classement"),
      h("p.chapeau", "Un point par adversaire battu à chaque partie. Les parties en solo ne rapportent pas de points mais comptent pour les records."),
      enLigne ? null : h("p.avis", "Ce classement est gardé dans ce navigateur. Branche Supabase pour un classement commun à toute la bande (voir le README)."),
      onglets,
      contenu
    )
  );
  const def = jeu ? JEUX[jeu] : null;
  const pid = moi().id;
  lireClassement(jeu)
    .then((lignes) => {
      if (!lignes.length) {
        vider(contenu, h("div.vide", h("p", "Personne n'a encore joué ici."), h("a.bouton", { href: "#/" }, "Lancer une partie")));
        return;
      }
      let rang = 0;
      vider(
        contenu,
        h(
          "table.tableau.tableau-classement",
          h(
            "thead",
            h("tr", h("th", h("span.visuellement-cache", "Rang")), h("th", "Joueur"), h("th.num", "Points"), h("th.num", "Victoires"), h("th.num", "Parties"), def ? h("th.num", "Record") : null)
          ),
          h(
            "tbody",
            lignes.map((l, i) => {
              if (i === 0 || lignes[i - 1].points !== l.points) rang = i + 1;
              return h(
                `tr${l.pid === pid ? ".moi" : ""}`,
                h("td.rang-cellule", h("span.ecran.rang", afficheur(String(rang), { taille: "s", titre: `Rang ${rang}` }))),
                h("td", etiquetteJoueur(l)),
                h("td.num.fort", String(l.points)),
                h("td.num", String(l.victoires)),
                h("td.num", String(l.parties)),
                def ? h("td.num", l.record != null ? def.score.format(Number(l.record)) : "—") : null
              );
            })
          )
        )
      );
    })
    .catch((e) => {
      console.error(e);
      vider(contenu, h("p.avis", "Impossible de lire le classement. Vérifie l'URL et la clé Supabase dans assets/js/config.js, et que schema.sql a bien été exécuté."));
    });
  return { detruire() {} };
}

// ── Démarrage ────────────────────────────────────────────────
entete();
demarrerFond();
naviguer();
window.addEventListener("hashchange", naviguer);


return __e; })();
</script>
</body>
</html>
